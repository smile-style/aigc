x-app-environment: &app-environment
  DJANGO_DEBUG: "false"
  DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in deploy/.env}"
  DJANGO_STATIC_ROOT: /app/staticfiles
  DJANGO_MEDIA_ROOT: /app/media
  WORKSPACE_DIR: /app/workspace
  LLM_LOG_PATH: /app/logs/llm.log
  DB_ENGINE: sqlite
  VIDEO_WORKER_INTERVAL_SECONDS: "${VIDEO_WORKER_INTERVAL_SECONDS:-5}"

x-app-service: &app-service
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    args:
      BASE_IMAGE: "${AIGC_BASE_IMAGE:-registry.cn-hangzhou.aliyuncs.com/docker-registry-cache/aigc-studio-base:py3.12-v1}"
  image: aigc-studio:latest
  env_file:
    - .env
  environment: *app-environment
  init: true
  stop_grace_period: 30s
  volumes:
    - type: bind
      source: /data/aigc_data/db.sqlite3
      target: /app/db.sqlite3
      bind:
        create_host_path: false
    - type: bind
      source: /data/aigc_data/workspace
      target: /app/workspace
      bind:
        create_host_path: false
    - type: bind
      source: ../logs
      target: /app/logs
      bind:
        create_host_path: false
    - type: bind
      source: /data/aigc_data/media
      target: /app/media
      bind:
        create_host_path: false
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  migrate:
    <<: *app-service
    restart: "no"
    command: ["python", "manage.py", "migrate", "--noinput"]

  aigc-studio:
    <<: *app-service
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-environment
      GUNICORN_WORKERS: "${SQLITE_GUNICORN_WORKERS:-1}"
      GUNICORN_TIMEOUT: "${GUNICORN_TIMEOUT:-360}"
    command:
      - sh
      - -c
      - >-
        exec gunicorn aigc_site.wsgi:application
        --bind 0.0.0.0:8000
        --workers "$${GUNICORN_WORKERS}"
        --timeout "$${GUNICORN_TIMEOUT}"
    ports:
      - "${AIGC_HTTP_PORT:-8080}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  video-worker:
    <<: *app-service
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "manage.py", "process_video_tasks"]
