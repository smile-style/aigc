name: aigc-staging

services:
  migrate:
    env_file:
      - .env.staging

  aigc-studio:
    env_file:
      - .env.staging
    ports:
      - "${AIGC_STAGING_HTTP_PORT:-8081}:8000"

  generation-worker:
    env_file:
      - .env.staging

  video-worker:
    env_file:
      - .env.staging

  publish-worker:
    env_file:
      - .env.staging

volumes:
  mysql_data:
    name: aigc_staging_mysql_data
  aigc_workspace:
    name: aigc_staging_workspace
  aigc_logs:
    name: aigc_staging_logs
  aigc_media:
    name: aigc_staging_media
