x-app-environment: &app-environment
  DJANGO_DEBUG: "false"
  DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}"
  DJANGO_STATIC_ROOT: /app/staticfiles
  DJANGO_MEDIA_ROOT: /app/media
  WORKSPACE_DIR: /app/workspace
  LLM_LOG_PATH: /app/workspace/llm.log
  DB_ENGINE: "${DB_ENGINE:-sqlite}"
  DB_NAME: "${MYSQL_DATABASE:-AIGC_STUDIO}"
  DB_USER: "${MYSQL_USER:-aigc_studio}"
  DB_PASSWORD: "${MYSQL_PASSWORD:-}"
  DB_HOST: "${DB_HOST:-aigc-db}"
  DB_PORT: "${DB_PORT:-3306}"
  GENERATION_WORKER_INTERVAL_SECONDS: "${GENERATION_WORKER_INTERVAL_SECONDS:-2}"
  GENERATION_MAX_CONCURRENCY: "1"
  GENERATION_LEASE_SECONDS: "${GENERATION_LEASE_SECONDS:-900}"
  VIDEO_WORKER_INTERVAL_SECONDS: "${VIDEO_WORKER_INTERVAL_SECONDS:-5}"
  PUBLISH_WORKER_INTERVAL_SECONDS: "${PUBLISH_WORKER_INTERVAL_SECONDS:-3}"
  PUBLISH_MAX_CONCURRENCY: "${PUBLISH_MAX_CONCURRENCY:-1}"
  PUBLISH_LEASE_SECONDS: "${PUBLISH_LEASE_SECONDS:-180}"
  PUBLISH_TASK_TIMEOUT_SECONDS: "${PUBLISH_TASK_TIMEOUT_SECONDS:-7200}"
  PUBLISHING_CREDENTIAL_ENCRYPTION_KEY: "${PUBLISHING_CREDENTIAL_ENCRYPTION_KEY:-}"

x-app-service: &app-service
  image: "${AIGC_IMAGE:?Set AIGC_IMAGE in .env}"
  env_file:
    - .env
  environment: *app-environment
  init: true
  stop_grace_period: 30s
  volumes:
    - type: bind
      source: /data/aigc_data/pre/db.sqlite3
      target: /app/db.sqlite3
      bind:
        create_host_path: false
    - type: bind
      source: /data/aigc_data/pre/workspace
      target: /app/workspace
      bind:
        create_host_path: false
    - type: bind
      source: /data/aigc_data/pre/media
      target: /app/media
      bind:
        create_host_path: false
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  aigc-db:
    profiles: ["mysql"]
    image: registry.cn-shanghai.aliyuncs.com/uwa/mysql:8.0
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-AIGC_STUDIO}"
      MYSQL_USER: "${MYSQL_USER:-aigc_studio}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-}"
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - type: bind
        source: /data/aigc_data/pre/mysql/data
        target: /var/lib/mysql
      - type: bind
        source: ../mysql/config/mysql.cnf
        target: /etc/mysql/conf.d/aigc.cnf
        read_only: true
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  migrate:
    <<: *app-service
    restart: "no"
    depends_on:
      aigc-db:
        condition: service_healthy
        required: false
    command: ["python", "manage.py", "migrate", "--noinput"]

  aigc-studio:
    <<: *app-service
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-environment
      GUNICORN_WORKERS: "${SQLITE_GUNICORN_WORKERS:-1}"
      GUNICORN_TIMEOUT: "${GUNICORN_TIMEOUT:-360}"
    command:
      - sh
      - -c
      - >-
        exec gunicorn aigc_site.wsgi:application
        --bind 0.0.0.0:8000
        --workers "$${GUNICORN_WORKERS}"
        --timeout "$${GUNICORN_TIMEOUT}"
    ports:
      - "${AIGC_HTTP_PORT:?Set AIGC_HTTP_PORT in .env}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  generation-worker:
    <<: *app-service
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "manage.py", "process_generation_tasks"]

  video-worker:
    <<: *app-service
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "manage.py", "process_video_tasks"]

  publish-worker:
    <<: *app-service
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "manage.py", "process_publish_tasks"]
